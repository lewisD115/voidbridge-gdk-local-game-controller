<link href="popup.css" rel="stylesheet" type="text/css" />
<script type="module" src="popup.js"></script>

<div class="container">
  <div>
    <div class="title">GDK - Run Local Game Config</div>

    <div class="controls" >
      <label class="switch">
        <input id="gameConfigToggle" type="checkbox">
        <span class="slider round"></span>
      </label>
      <div class="labelText">Enable</div>
    </div>

    <div class="title">GDK - Run Mobile Game Config</div>
      <div class="controls" >
        <label class="switch">
          <input id="mobileClientToggle" type="checkbox">
          <span class="slider round"></span>
        </label>
        <div class="labelText">Enable</div>
      </div>
    </div>

    <div class="simContainer">
      <div class="simInfo">
          <div>userId: <span id="userId" class="fetched">-</span></div>
          <div>sessionId: <span id="sessionId" class="fetched">-</span></div>
      </div>
      <button id="openSimulation" class="regButton">
          Open Simulation
      </button>
    </div>

    <details>
      <summary>Initial Game Development Actions</summary>

      <div class="copyDataContainer">
        <div class="buttonDiv">
          <button id="copySymbols" class="regButton">
            Extract & Copy Symbols
          </button>
        </div>
        <div class="buttonDiv">
          <button id="copyLineData" class="regButton">
            Extract & Copy Line Data
          </button>
        </div>
      </div>
    </details>

    <div id="status"></div>
  </div>
</div>
